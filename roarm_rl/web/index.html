<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>RoArm</title>
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app">
  <section id="stage">
    <canvas id="view"></canvas>
    <header class="hud">
      <div class="brand"><span class="dot" id="link-dot"></span>RoArm</div>
      <div class="chips">
        <span class="chip" id="chip-gesture" hidden></span>
        <span class="chip warn" id="chip-inventing" hidden>inventing a gesture…</span>
        <span class="chip" id="chip-hw" hidden>real arm</span>
        <span class="chip warn" id="chip-limp" hidden>motors released</span>
      </div>
    </header>
    <div class="stage-actions">
      <button class="btn ghost" id="btn-home">Home</button>
      <button class="btn danger" id="btn-stop">Stop</button>
    </div>
    <p class="notice" id="gl-notice" hidden></p>
  </section>

  <section id="panel">
    <div class="panes">
      <div class="pane active" id="pane-chat">
        <div id="log" aria-live="polite"></div>
        <div class="suggest" id="suggest"></div>
        <form id="say" autocomplete="off">
          <button type="button" class="icon" id="mic" title="Talk" aria-label="Talk">
            <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2Z"/></svg>
          </button>
          <input id="text" placeholder="Tell the arm what to do" enterkeyhint="send">
          <button class="icon accent" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
          </button>
        </form>
        <p class="hint" id="mic-hint" hidden></p>
      </div>

      <div class="pane" id="pane-gestures">
        <input id="search" type="search" placeholder="Search gestures">
        <div class="controls">
          <div class="seg" id="seg-speed"></div>
          <div class="seg" id="seg-size"></div>
          <div class="seg" id="seg-side"></div>
        </div>
        <div class="grid" id="grid"></div>
      </div>

      <div class="pane" id="pane-learning">
        <div class="tiles" id="tiles"></div>
        <h3>Last 14 days</h3>
        <div class="bars" id="days"></div>
        <p class="legend"><i class="k used"></i>things it did <i class="k lesson"></i>things it learned</p>
        <h3>What it has learned you like</h3>
        <div id="taste"></div>
        <h3>Skills</h3>
        <div id="skills"></div>
        <form id="skill-form" autocomplete="off">
          <input id="skill-name" placeholder="Skill name, e.g. greeting">
          <input id="skill-steps" placeholder="Steps, e.g. wave, then bow">
          <button class="btn">Teach</button>
        </form>
        <h3>Invented gestures</h3>
        <div id="invented"></div>
        <h3>Recent lessons</h3>
        <div id="lessons"></div>
      </div>

      <div class="pane" id="pane-control">
        <div id="sliders"></div>
        <label class="toggle"><input type="checkbox" id="mirror"><span></span>Mirror to the real arm</label>
        <label class="toggle"><input type="checkbox" id="torque" checked><span></span>Motors holding (torque)</label>
        <div class="confirm" id="torque-confirm" hidden>
          <p>The arm will go limp and can fall. Hold it first.</p>
          <button class="btn danger" id="torque-release" type="button">Release motors</button>
          <button class="btn" id="torque-cancel" type="button">Cancel</button>
        </div>
        <p class="hint" id="hw-hint"></p>
      </div>
    </div>
    <nav class="tabs">
      <button data-pane="chat" class="active">Chat</button>
      <button data-pane="gestures">Gestures</button>
      <button data-pane="learning">Learning</button>
      <button data-pane="control">Control</button>
    </nav>
  </section>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
